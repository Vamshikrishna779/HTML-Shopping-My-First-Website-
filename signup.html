<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: black;
}
h2 {
  color: cyan;
}

form{
  border: 3px solid #f1f1f1;
  width: max-content;
  text-align: left;
  background-color: black;
  color: rgb(83, 223, 67);
  border-radius: 10px;
}
input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
button {
  background-color: #4318a8;
  color: white;
  padding: 10px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 30%;
}

button:hover {
  opacity: 0.8;
}

.container {
  padding: 16px;
}

</style>
</head>
<body>
<center>
<h2>Sign Up</h2>
<form action="signup.php" method="post">
  <div class="container">
    <label for="name"><b>Name</b></label>
    <input type="text" placeholder="Enter your name" name="name" required><br>
    <label for="uname"><b>Create Username</b></label>
    <input type="text" placeholder="Enter Username" name="username" required><br>
    <label for="email"><b>Email</b></label>
    <input type="text" placeholder="Enter your email" name="email" required><br>
    <label for="mobile"><b>Mobile Number</b></label>
    <input type="text" placeholder="Enter your mobile number" name="mobile" required><br>
    <label for="address"><b>Address</b></label>
    <input type="text" placeholder="Enter your address" name="address" required><br>
    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="password" required><br>
    <center><button type="submit">Sign Up</button></center>
  </div>
  <div class="container" style="background-color:#f1f1f1">
    <button type="button" class="cancelbtn">Cancel</button>
    <span class="psw">Already have an account<a href="login.html">Login</a></span>
  </div>
</form>
</center>
</body>
</html>
